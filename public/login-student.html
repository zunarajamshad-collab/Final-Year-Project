<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Learnify</title>
    <meta name="description" content="Log in as a student to submit projects, view quiz history, and inspect dashboard feedback.">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="auth-container animate-fade">
        <div class="glass-panel auth-card" id="studentLoginCard">
            <!-- Back to Home -->
            <a href="/" style="position: absolute; top: 1.5rem; left: 1.5rem; text-decoration: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 4px;">
                &larr; Back
            </a>
            
            <div class="auth-header">
                <div class="logo-container" style="justify-content: center; margin-bottom: 1rem;">
                    <div class="logo-icon">L</div>
                    <span style="font-weight: 700; font-size: 1.3rem; letter-spacing: 1px;">LEARNIFY</span>
                </div>
                <h1 class="auth-header-title" style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem;">Student Log In</h1>
                <p>Learnify Smart Learning Portal</p>
            </div>

            <form id="studentLoginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. student" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-glow" style="width: 100%; margin-top: 1rem;" id="studentLoginSubmitBtn">
                    Authenticate &rarr;
                </button>
            </form>

            <!-- Test credentials assistance helper -->
            <div style="margin-top: 2rem; padding: 1rem; border-radius: 10px; background: rgba(99, 102, 241, 0.05); border: 1px dashed rgba(99, 102, 241, 0.2); font-size: 0.85rem; text-align: center;">
                <span style="color: var(--color-primary); font-weight: 600;">Mock Credentials:</span><br>
                Username: <code style="color: white; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;">student</code> &nbsp;|&nbsp; 
                Password: <code style="color: white; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;">student123</code>
            </div>
        </div>
    </div>

    <!-- Background Toast container -->
    <div class="toast-container"></div>

    <script src="/assets/js/auth.js"></script>
    <script>
        document.getElementById('studentLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            performLogin(user, pass, 'student');
        });
    </script>
</body>
</html>
